[project]
name = "aws-dbt-snowflake"
version = "0.1.0"
description = "AWS and Snowflake dbt project"
readme = "README.md"
authors = [
    { name = "Raghasripranati Daggubati", email = "raghasri20@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbt-core>=1.10,<2.0",
    "dbt-snowflake"
]

[project.scripts]
dbt-snowflake = "dbt_snowflake:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
